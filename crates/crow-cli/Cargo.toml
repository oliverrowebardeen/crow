[package]
name = "crow-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line frontend for crow."

[[bin]]
name = "crow"
path = "src/main.rs"

[dependencies]
crow = { path = "../crow" }
crow-net = { path = "../crow-net" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
