[package]
name = "crow"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Content-addressed file storage with erasure coding and capabilities."

[dependencies]
blake3 = "1.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
reed-solomon-simd = "3"
postcard = { version = "1", features = ["use-std"] }
bech32 = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
bytes = "1"
thiserror = "2"
subtle = "2"

[dev-dependencies]
rand = "0.8"
tempfile = "3"
